# ============================================
# Code Reviewer Skill - Complete Configuration
# ============================================
# This demonstrates all YAML benefits in one file:
# - Comments for documentation
# - Clean, readable structure
# - Multi-line strings
# - No unnecessary quotes or brackets
# - Anchors for reusable settings

# Skill Metadata
metadata:
  name: code-reviewer
  version: 3.2.1
  author: Master Yang
  description: >
    Automated code review assistant that analyzes code quality,
    security, and best practices
  created: 2026-01-15T00:00:00Z
  updated: 2026-02-20T00:00:00Z

# System Prompt - using literal block for clean formatting
system_prompt: |
  You are an expert code reviewer with deep knowledge of software engineering best practices.
  
  Focus areas:
  - Code quality and maintainability
  - Security vulnerabilities
  - Performance optimization
  - Design patterns and architecture
  - Testing coverage
  
  Provide constructive feedback with specific examples and suggestions.

# Main Configuration
configuration:
  # Supported programming languages
  languages:
    - python
    - javascript
    - typescript
    - java
    - go
  
  # File processing limits
  max_file_size_kb: 500  # Skip files larger than this
  
  # Patterns to exclude from review
  exclude_patterns:
    - "*.min.js"      # Minified files
    - "*.bundle.js"   # Bundled files
    - "node_modules/*"  # Dependencies
    - "venv/*"        # Python virtual env
  
  # Issue severity tracking (initialize to 0)
  severity_levels: &severity_init
    critical: 0
    high: 0
    medium: 0
    low: 0
    info: 0

# Review Rules Configuration
review_rules:
  
  # Security Checks
  security:
    enabled: true
    check_sql_injection: true    # Detect SQL injection vulnerabilities
    check_xss: true              # Cross-site scripting detection
    check_secrets: true          # Hardcoded secrets/keys
    check_dependencies: true     # Known vulnerable dependencies
  
  # Code Quality Checks
  quality:
    enabled: true
    max_function_length: 50      # Lines per function
    max_complexity: 10           # Cyclomatic complexity threshold
    require_docstrings: true     # All functions must have docs
    check_naming_conventions: true  # PEP8, camelCase, etc.
  
  # Performance Checks
  performance:
    enabled: true
    check_n_plus_one: true       # Database query optimization
    check_memory_leaks: true     # Memory management issues
    check_algorithm_complexity: true  # Big-O analysis

# Output Configuration
output:
  format: markdown               # markdown | json | html
  include_line_numbers: true     # Show exact line numbers
  include_severity: true         # Color-code by severity
  include_examples: true         # Provide code examples
  summary_first: true            # Executive summary at top

# ============================================
# YAML vs JSON Comparison
# ============================================
# 
# JSON version: 1,670 bytes, hard to read
# YAML version: More bytes due to comments, but:
#   - Self-documenting
#   - Easy to understand without separate docs
#   - Simple to modify
#   - Less error-prone
#   - Professional and maintainable
#
# The extra bytes are worth it for human readability!
# ============================================
